# Deploy Cloudflare Worker - GitHub Actions Workflow
# Automatically deploys the firmware builder worker when code changes

name: Deploy Worker

on:
  push:
    branches:
      - firmware/ik-calculations  # TODO: Change to main after merge
    paths:
      - 'tools/firmware-builder/worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare
        working-directory: tools/firmware-builder/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy

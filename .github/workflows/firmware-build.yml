# Rep5x Firmware Builder - GitHub Actions Workflow
# Triggered by Cloudflare Worker to compile custom firmware configurations

name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true
        type: string
      board:
        description: 'Target board'
        required: true
        default: 'octopus_v1.1'
        type: string

env:
  WORKER_URL: https://rep5x-firmware-builder.klappe.workers.dev
  MARLIN_REPO: https://github.com/dennisklappe/Rep5x-Marlin.git
  MARLIN_BRANCH: Marlin2ForPipetBot
  BASE_CONFIG: config/examples/Rep5x/Ender3V3SE_OctopusV1.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log build info
        run: |
          echo "Build ID: ${{ github.event.inputs.build_id }}"
          echo "Board: ${{ github.event.inputs.board }}"

      - name: Clone Rep5x-Marlin
        run: |
          git clone --depth 1 --branch ${{ env.MARLIN_BRANCH }} ${{ env.MARLIN_REPO }} marlin
          echo "Marlin cloned successfully"

      - name: Copy base configuration
        run: |
          cp marlin/${{ env.BASE_CONFIG }}/Configuration.h marlin/Marlin/Configuration.h
          cp marlin/${{ env.BASE_CONFIG }}/Configuration_adv.h marlin/Marlin/Configuration_adv.h
          echo "Base configuration copied"

      - name: Fetch and apply customizations
        id: fetch-config
        run: |
          # Fetch customizations from worker
          CUSTOMIZATIONS=$(curl -s "${{ env.WORKER_URL }}/config/${{ github.event.inputs.build_id }}")
          echo "Fetched customizations"
          echo "$CUSTOMIZATIONS" | jq .

          # Save customizations for debugging
          echo "$CUSTOMIZATIONS" > customizations.json

          # === DIMENSIONS ===
          X_BED_SIZE=$(echo "$CUSTOMIZATIONS" | jq -r '.xBedSize // empty')
          Y_BED_SIZE=$(echo "$CUSTOMIZATIONS" | jq -r '.yBedSize // empty')
          Z_MAX_POS=$(echo "$CUSTOMIZATIONS" | jq -r '.zMaxPos // empty')

          if [ -n "$X_BED_SIZE" ]; then
            sed -i "s/^#define X_BED_SIZE.*/#define X_BED_SIZE $X_BED_SIZE/" marlin/Marlin/Configuration.h
            echo "Set X_BED_SIZE to $X_BED_SIZE"
          fi
          if [ -n "$Y_BED_SIZE" ]; then
            sed -i "s/^#define Y_BED_SIZE.*/#define Y_BED_SIZE $Y_BED_SIZE/" marlin/Marlin/Configuration.h
            echo "Set Y_BED_SIZE to $Y_BED_SIZE"
          fi
          if [ -n "$Z_MAX_POS" ]; then
            sed -i "s/^#define Z_MAX_POS.*/#define Z_MAX_POS $Z_MAX_POS/" marlin/Marlin/Configuration.h
            echo "Set Z_MAX_POS to $Z_MAX_POS"
          fi

          # === HOMING DIRECTIONS ===
          X_HOME_DIR=$(echo "$CUSTOMIZATIONS" | jq -r '.xHomeDir // empty')
          Y_HOME_DIR=$(echo "$CUSTOMIZATIONS" | jq -r '.yHomeDir // empty')
          Z_HOME_DIR=$(echo "$CUSTOMIZATIONS" | jq -r '.zHomeDir // empty')

          if [ -n "$X_HOME_DIR" ]; then
            sed -i "s/^#define X_HOME_DIR.*/#define X_HOME_DIR $X_HOME_DIR/" marlin/Marlin/Configuration.h
            echo "Set X_HOME_DIR to $X_HOME_DIR"
          fi
          if [ -n "$Y_HOME_DIR" ]; then
            sed -i "s/^#define Y_HOME_DIR.*/#define Y_HOME_DIR $Y_HOME_DIR/" marlin/Marlin/Configuration.h
            echo "Set Y_HOME_DIR to $Y_HOME_DIR"
          fi
          if [ -n "$Z_HOME_DIR" ]; then
            sed -i "s/^#define Z_HOME_DIR.*/#define Z_HOME_DIR $Z_HOME_DIR/" marlin/Marlin/Configuration.h
            echo "Set Z_HOME_DIR to $Z_HOME_DIR"
          fi

          # === STEPPER DRIVERS ===
          DRIVER_X=$(echo "$CUSTOMIZATIONS" | jq -r '.driverX // empty')
          DRIVER_Y=$(echo "$CUSTOMIZATIONS" | jq -r '.driverY // empty')
          DRIVER_Z=$(echo "$CUSTOMIZATIONS" | jq -r '.driverZ // empty')
          DRIVER_C=$(echo "$CUSTOMIZATIONS" | jq -r '.driverC // empty')
          DRIVER_B=$(echo "$CUSTOMIZATIONS" | jq -r '.driverB // empty')
          DRIVER_E=$(echo "$CUSTOMIZATIONS" | jq -r '.driverE // empty')

          if [ -n "$DRIVER_X" ]; then
            sed -i "s/^#define X_DRIVER_TYPE.*/#define X_DRIVER_TYPE $DRIVER_X/" marlin/Marlin/Configuration.h
            echo "Set X_DRIVER_TYPE to $DRIVER_X"
          fi
          if [ -n "$DRIVER_Y" ]; then
            sed -i "s/^#define Y_DRIVER_TYPE.*/#define Y_DRIVER_TYPE $DRIVER_Y/" marlin/Marlin/Configuration.h
          fi
          if [ -n "$DRIVER_Z" ]; then
            sed -i "s/^#define Z_DRIVER_TYPE.*/#define Z_DRIVER_TYPE $DRIVER_Z/" marlin/Marlin/Configuration.h
          fi
          if [ -n "$DRIVER_C" ]; then
            sed -i "s/^#define I_DRIVER_TYPE.*/#define I_DRIVER_TYPE $DRIVER_C/" marlin/Marlin/Configuration.h
          fi
          if [ -n "$DRIVER_B" ]; then
            sed -i "s/^#define J_DRIVER_TYPE.*/#define J_DRIVER_TYPE $DRIVER_B/" marlin/Marlin/Configuration.h
          fi
          if [ -n "$DRIVER_E" ]; then
            sed -i "s/^#define E0_DRIVER_TYPE.*/#define E0_DRIVER_TYPE $DRIVER_E/" marlin/Marlin/Configuration.h
          fi

          # === STEPS PER UNIT ===
          STEPS_X=$(echo "$CUSTOMIZATIONS" | jq -r '.stepsX // empty')
          STEPS_Y=$(echo "$CUSTOMIZATIONS" | jq -r '.stepsY // empty')
          STEPS_Z=$(echo "$CUSTOMIZATIONS" | jq -r '.stepsZ // empty')
          STEPS_C=$(echo "$CUSTOMIZATIONS" | jq -r '.stepsC // empty')
          STEPS_B=$(echo "$CUSTOMIZATIONS" | jq -r '.stepsB // empty')
          STEPS_E=$(echo "$CUSTOMIZATIONS" | jq -r '.stepsE // empty')

          if [ -n "$STEPS_X" ] && [ -n "$STEPS_Y" ] && [ -n "$STEPS_Z" ] && [ -n "$STEPS_C" ] && [ -n "$STEPS_B" ] && [ -n "$STEPS_E" ]; then
            sed -i "s/^#define DEFAULT_AXIS_STEPS_PER_UNIT.*/#define DEFAULT_AXIS_STEPS_PER_UNIT   { $STEPS_X, $STEPS_Y, $STEPS_Z, $STEPS_C, $STEPS_B, $STEPS_E }/" marlin/Marlin/Configuration.h
            echo "Set steps per unit: $STEPS_X, $STEPS_Y, $STEPS_Z, $STEPS_C, $STEPS_B, $STEPS_E"
          fi

          # === MOTOR DIRECTIONS ===
          INVERT_X=$(echo "$CUSTOMIZATIONS" | jq -r '.invertX // empty')
          INVERT_Y=$(echo "$CUSTOMIZATIONS" | jq -r '.invertY // empty')
          INVERT_Z=$(echo "$CUSTOMIZATIONS" | jq -r '.invertZ // empty')
          INVERT_C=$(echo "$CUSTOMIZATIONS" | jq -r '.invertC // empty')
          INVERT_B=$(echo "$CUSTOMIZATIONS" | jq -r '.invertB // empty')
          INVERT_E=$(echo "$CUSTOMIZATIONS" | jq -r '.invertE // empty')

          if [ -n "$INVERT_X" ]; then
            sed -i "s/^#define INVERT_X_DIR.*/#define INVERT_X_DIR $INVERT_X/" marlin/Marlin/Configuration.h
          fi
          if [ -n "$INVERT_Y" ]; then
            sed -i "s/^#define INVERT_Y_DIR.*/#define INVERT_Y_DIR $INVERT_Y/" marlin/Marlin/Configuration.h
          fi
          if [ -n "$INVERT_Z" ]; then
            sed -i "s/^#define INVERT_Z_DIR.*/#define INVERT_Z_DIR $INVERT_Z/" marlin/Marlin/Configuration.h
          fi
          if [ -n "$INVERT_C" ]; then
            sed -i "s/^#define INVERT_I_DIR.*/#define INVERT_I_DIR $INVERT_C/" marlin/Marlin/Configuration.h
          fi
          if [ -n "$INVERT_B" ]; then
            sed -i "s/^#define INVERT_J_DIR.*/#define INVERT_J_DIR $INVERT_B/" marlin/Marlin/Configuration.h
          fi
          if [ -n "$INVERT_E" ]; then
            sed -i "s/^#define INVERT_E0_DIR.*/#define INVERT_E0_DIR $INVERT_E/" marlin/Marlin/Configuration.h
          fi

          # === ENDSTOP HIT STATES ===
          ENDSTOP_X=$(echo "$CUSTOMIZATIONS" | jq -r '.endstopX // empty')
          ENDSTOP_Y=$(echo "$CUSTOMIZATIONS" | jq -r '.endstopY // empty')
          ENDSTOP_Z=$(echo "$CUSTOMIZATIONS" | jq -r '.endstopZ // empty')
          ENDSTOP_C=$(echo "$CUSTOMIZATIONS" | jq -r '.endstopC // empty')
          ENDSTOP_B=$(echo "$CUSTOMIZATIONS" | jq -r '.endstopB // empty')

          if [ -n "$ENDSTOP_X" ]; then
            sed -i "s/^#define X_MIN_ENDSTOP_HIT_STATE.*/#define X_MIN_ENDSTOP_HIT_STATE $ENDSTOP_X/" marlin/Marlin/Configuration.h
            sed -i "s/^#define X_MAX_ENDSTOP_HIT_STATE.*/#define X_MAX_ENDSTOP_HIT_STATE $ENDSTOP_X/" marlin/Marlin/Configuration.h
            echo "Set X endstop hit state to $ENDSTOP_X"
          fi
          if [ -n "$ENDSTOP_Y" ]; then
            sed -i "s/^#define Y_MIN_ENDSTOP_HIT_STATE.*/#define Y_MIN_ENDSTOP_HIT_STATE $ENDSTOP_Y/" marlin/Marlin/Configuration.h
            sed -i "s/^#define Y_MAX_ENDSTOP_HIT_STATE.*/#define Y_MAX_ENDSTOP_HIT_STATE $ENDSTOP_Y/" marlin/Marlin/Configuration.h
            echo "Set Y endstop hit state to $ENDSTOP_Y"
          fi
          if [ -n "$ENDSTOP_Z" ]; then
            sed -i "s/^#define Z_MIN_ENDSTOP_HIT_STATE.*/#define Z_MIN_ENDSTOP_HIT_STATE $ENDSTOP_Z/" marlin/Marlin/Configuration.h
            sed -i "s/^#define Z_MAX_ENDSTOP_HIT_STATE.*/#define Z_MAX_ENDSTOP_HIT_STATE $ENDSTOP_Z/" marlin/Marlin/Configuration.h
            echo "Set Z endstop hit state to $ENDSTOP_Z"
          fi
          if [ -n "$ENDSTOP_C" ]; then
            sed -i "s/^#define I_MIN_ENDSTOP_HIT_STATE.*/#define I_MIN_ENDSTOP_HIT_STATE $ENDSTOP_C/" marlin/Marlin/Configuration.h
            sed -i "s/^#define I_MAX_ENDSTOP_HIT_STATE.*/#define I_MAX_ENDSTOP_HIT_STATE $ENDSTOP_C/" marlin/Marlin/Configuration.h
            echo "Set C endstop hit state to $ENDSTOP_C"
          fi
          if [ -n "$ENDSTOP_B" ]; then
            sed -i "s/^#define J_MIN_ENDSTOP_HIT_STATE.*/#define J_MIN_ENDSTOP_HIT_STATE $ENDSTOP_B/" marlin/Marlin/Configuration.h
            sed -i "s/^#define J_MAX_ENDSTOP_HIT_STATE.*/#define J_MAX_ENDSTOP_HIT_STATE $ENDSTOP_B/" marlin/Marlin/Configuration.h
            echo "Set B endstop hit state to $ENDSTOP_B"
          fi

          # === SENSORLESS XY HOMING ===
          XY_HOMING_MODE=$(echo "$CUSTOMIZATIONS" | jq -r '.xyHomingMode // empty')
          if [ "$XY_HOMING_MODE" = "sensorless" ]; then
            STALL_X=$(echo "$CUSTOMIZATIONS" | jq -r '.stallSensitivityX // 8')
            STALL_Y=$(echo "$CUSTOMIZATIONS" | jq -r '.stallSensitivityY // 8')

            # Enable SENSORLESS_HOMING (commented + indented inside the TMC block)
            sed -i 's|^[[:space:]]*//#define SENSORLESS_HOMING.*|  #define SENSORLESS_HOMING|' marlin/Marlin/Configuration_adv.h

            # Set X/Y stall sensitivities (the X2_/Y2_ lines reference these, leave them)
            sed -i "s|^[[:space:]]*#define X_STALL_SENSITIVITY .*|    #define X_STALL_SENSITIVITY  $STALL_X|" marlin/Marlin/Configuration_adv.h
            sed -i "s|^[[:space:]]*#define Y_STALL_SENSITIVITY .*|    #define Y_STALL_SENSITIVITY  $STALL_Y|" marlin/Marlin/Configuration_adv.h

            # Marlin recommends zero homing bump for sensorless axes
            sed -i 's|^#define HOMING_BUMP_MM .*|#define HOMING_BUMP_MM      { 0, 0, 3, 5, 2 }|' marlin/Marlin/Configuration_adv.h

            echo "Enabled sensorless XY homing (X sensitivity=$STALL_X, Y sensitivity=$STALL_Y)"
          else
            echo "XY homing uses physical endstops"
          fi

          # === CASE LIGHT LED ===
          CASE_LIGHT_ENABLED=$(echo "$CUSTOMIZATIONS" | jq -r '.caseLightEnabled // empty')
          if [ "$CASE_LIGHT_ENABLED" = "true" ]; then
            CASE_LIGHT_BRIGHTNESS=$(echo "$CUSTOMIZATIONS" | jq -r '.caseLightBrightness // 105')
            LED_PIN=$(echo "$CUSTOMIZATIONS" | jq -r '.pinOverrides.led // "PD13"')

            # Enable the feature (commented at column 0 in the base config)
            sed -i 's|^//#define CASE_LIGHT_ENABLE|#define CASE_LIGHT_ENABLE|' marlin/Marlin/Configuration_adv.h

            # Set the LED pin (commented + indented inside the CASE_LIGHT block)
            sed -i "s|^[[:space:]]*//#define CASE_LIGHT_PIN .*|  #define CASE_LIGHT_PIN $LED_PIN|" marlin/Marlin/Configuration_adv.h

            # Set default brightness (already uncommented + indented)
            sed -i "s|^[[:space:]]*#define CASE_LIGHT_DEFAULT_BRIGHTNESS .*|  #define CASE_LIGHT_DEFAULT_BRIGHTNESS $CASE_LIGHT_BRIGHTNESS|" marlin/Marlin/Configuration_adv.h

            echo "Enabled case light LED on pin $LED_PIN (brightness $CASE_LIGHT_BRIGHTNESS)"
          else
            echo "Case light disabled"
          fi

          # === ADVANCED PIN OVERRIDES (endstops + fans) ===
          PIN_ENDSTOP_X=$(echo "$CUSTOMIZATIONS" | jq -r '.pinOverrides.endstopX // empty')
          PIN_ENDSTOP_Y=$(echo "$CUSTOMIZATIONS" | jq -r '.pinOverrides.endstopY // empty')
          PIN_ENDSTOP_Z=$(echo "$CUSTOMIZATIONS" | jq -r '.pinOverrides.endstopZ // empty')
          PIN_ENDSTOP_C=$(echo "$CUSTOMIZATIONS" | jq -r '.pinOverrides.endstopC // empty')
          PIN_ENDSTOP_B=$(echo "$CUSTOMIZATIONS" | jq -r '.pinOverrides.endstopB // empty')

          # C and B endstops already have #define lines in the base config
          if [ -n "$PIN_ENDSTOP_C" ]; then
            sed -i "s|^#define I_MIN_PIN .*|#define I_MIN_PIN $PIN_ENDSTOP_C   // C-axis endstop (Rep5x Firmware Builder)|" marlin/Marlin/Configuration.h
            echo "Set I_MIN_PIN (C endstop) to $PIN_ENDSTOP_C"
          fi
          if [ -n "$PIN_ENDSTOP_B" ]; then
            sed -i "s|^#define J_MIN_PIN .*|#define J_MIN_PIN $PIN_ENDSTOP_B   // B-axis endstop (Rep5x Firmware Builder)|" marlin/Marlin/Configuration.h
            echo "Set J_MIN_PIN (B endstop) to $PIN_ENDSTOP_B"
          fi

          # X/Y/Z endstops: append guarded overrides after the J_MIN_PIN line
          for AXIS_PIN in "X_MIN_PIN:$PIN_ENDSTOP_X" "Y_MIN_PIN:$PIN_ENDSTOP_Y" "Z_MIN_PIN:$PIN_ENDSTOP_Z"; do
            DEF_NAME="${AXIS_PIN%%:*}"
            DEF_VAL="${AXIS_PIN##*:}"
            if [ -n "$DEF_VAL" ]; then
              sed -i "/^#define J_MIN_PIN /a #ifndef $DEF_NAME\\n  #define $DEF_NAME $DEF_VAL  // Rep5x Firmware Builder\\n#endif" marlin/Marlin/Configuration.h
              echo "Set $DEF_NAME to $DEF_VAL"
            fi
          done

          # Hotend / auto fan -> E0_AUTO_FAN_PIN (settable define in Configuration_adv.h)
          PIN_FAN_HOTEND=$(echo "$CUSTOMIZATIONS" | jq -r '.pinOverrides.fanHotend // empty')
          if [ -n "$PIN_FAN_HOTEND" ]; then
            sed -i "s|^#define E0_AUTO_FAN_PIN .*|#define E0_AUTO_FAN_PIN $PIN_FAN_HOTEND  // Rep5x Firmware Builder|" marlin/Marlin/Configuration_adv.h
            echo "Set E0_AUTO_FAN_PIN to $PIN_FAN_HOTEND"
          fi

          # Controller fan -> enable USE_CONTROLLER_FAN + set its pin
          PIN_FAN_CONTROLLER=$(echo "$CUSTOMIZATIONS" | jq -r '.pinOverrides.fanController // empty')
          if [ -n "$PIN_FAN_CONTROLLER" ]; then
            sed -i 's|^//#define USE_CONTROLLER_FAN|#define USE_CONTROLLER_FAN|' marlin/Marlin/Configuration_adv.h
            sed -i "s|^[[:space:]]*//#define CONTROLLER_FAN_PIN .*|  #define CONTROLLER_FAN_PIN $PIN_FAN_CONTROLLER  // Rep5x Firmware Builder|" marlin/Marlin/Configuration_adv.h
            echo "Set CONTROLLER_FAN_PIN to $PIN_FAN_CONTROLLER"
          fi

          # === IK PARAMETERS ===
          IK_LC=$(echo "$CUSTOMIZATIONS" | jq -r '.ikLC // empty')
          IK_LB=$(echo "$CUSTOMIZATIONS" | jq -r '.ikLB // empty')

          if [ -n "$IK_LC" ]; then
            sed -i "s/^#define DEFAULT_ROTATIONAL_JOINT_OFFSET_Y.*/#define DEFAULT_ROTATIONAL_JOINT_OFFSET_Y $IK_LC/" marlin/Marlin/Configuration.h
            echo "Set LC (OFFSET_Y) to $IK_LC"
          fi
          if [ -n "$IK_LB" ]; then
            sed -i "s/^#define DEFAULT_ROTATIONAL_JOINT_OFFSET_Z.*/#define DEFAULT_ROTATIONAL_JOINT_OFFSET_Z $IK_LB/" marlin/Marlin/Configuration.h
            echo "Set LB (OFFSET_Z) to $IK_LB"
          fi

          # === IK ENABLED (Tool Centerpoint Control) ===
          IK_ENABLED=$(echo "$CUSTOMIZATIONS" | jq -r '.ikEnabled // empty')
          if [ -n "$IK_ENABLED" ]; then
            sed -i "s/^#define DEFAULT_TOOL_CENTERPOINT_CONTROL.*/#define DEFAULT_TOOL_CENTERPOINT_CONTROL $IK_ENABLED/" marlin/Marlin/Configuration.h
            echo "Set DEFAULT_TOOL_CENTERPOINT_CONTROL to $IK_ENABLED"
          fi

          # === C AXIS HOME POSITION ===
          C_HOME_POS=$(echo "$CUSTOMIZATIONS" | jq -r '.cHomePos // empty')
          if [ -n "$C_HOME_POS" ]; then
            sed -i "s/^#define MANUAL_I_HOME_POS.*/#define MANUAL_I_HOME_POS $C_HOME_POS/" marlin/Marlin/Configuration.h
            echo "Set MANUAL_I_HOME_POS to $C_HOME_POS"
          fi

          # === B AXIS RANGE ===
          B_RANGE=$(echo "$CUSTOMIZATIONS" | jq -r '.bRange // empty')
          if [ -n "$B_RANGE" ]; then
            sed -i "s/^#define J_MIN_POS.*/#define J_MIN_POS -$B_RANGE/" marlin/Marlin/Configuration.h
            sed -i "s/^#define J_MAX_POS.*/#define J_MAX_POS $B_RANGE/" marlin/Marlin/Configuration.h
            echo "Set J_MIN_POS to -$B_RANGE, J_MAX_POS to $B_RANGE"
          fi

          # === EVENT AFTER HOMING ===
          EVENT_AFTER_HOMING_ENABLED=$(echo "$CUSTOMIZATIONS" | jq -r '.eventAfterHomingEnabled // empty')
          EVENT_AFTER_HOMING_GCODE=$(echo "$CUSTOMIZATIONS" | jq -r '.eventAfterHomingGcode // empty')
          if [ "$EVENT_AFTER_HOMING_ENABLED" = "true" ] && [ -n "$EVENT_AFTER_HOMING_GCODE" ]; then
            # Escape backslashes and convert newlines to \n for C string
            ESCAPED_GCODE=$(echo "$EVENT_AFTER_HOMING_GCODE" | sed 's/\\/\\\\/g' | sed ':a;N;$!ba;s/\n/\\n/g')
            # Add the define (it may not exist in base config, so append after XY_AFTER_HOMING)
            sed -i "/^\/\/#define XY_AFTER_HOMING/a #define EVENT_GCODE_AFTER_HOMING \"$ESCAPED_GCODE\"" marlin/Marlin/Configuration.h
            echo "Set EVENT_GCODE_AFTER_HOMING to: $ESCAPED_GCODE"
          fi

          # === DISPLAY ===
          DISPLAY=$(echo "$CUSTOMIZATIONS" | jq -r '.display // empty')
          if [ -n "$DISPLAY" ]; then
            # Disable all display options first
            sed -i 's/^#define BTT_MINI_12864/\/\/#define BTT_MINI_12864/' marlin/Marlin/Configuration.h
            sed -i 's/^#define REPRAP_DISCOUNT_FULL_GRAPHIC_SMART_CONTROLLER/\/\/#define REPRAP_DISCOUNT_FULL_GRAPHIC_SMART_CONTROLLER/' marlin/Marlin/Configuration.h
            sed -i 's/^#define CR10_STOCKDISPLAY/\/\/#define CR10_STOCKDISPLAY/' marlin/Marlin/Configuration.h

            # Enable the selected display
            case "$DISPLAY" in
              "btt_mini_12864")
                sed -i 's/^\/\/#define BTT_MINI_12864/#define BTT_MINI_12864/' marlin/Marlin/Configuration.h
                echo "Set display to BTT Mini 12864"
                ;;
              "reprap_full_graphic")
                sed -i 's/^\/\/#define REPRAP_DISCOUNT_FULL_GRAPHIC_SMART_CONTROLLER/#define REPRAP_DISCOUNT_FULL_GRAPHIC_SMART_CONTROLLER/' marlin/Marlin/Configuration.h
                echo "Set display to RepRap Full Graphic"
                ;;
              "cr10_stock")
                sed -i 's/^\/\/#define CR10_STOCKDISPLAY/#define CR10_STOCKDISPLAY/' marlin/Marlin/Configuration.h
                echo "Set display to CR-10 Stock Display"
                ;;
              "none")
                echo "No display selected"
                ;;
            esac

            # Disable neopixel for non-BTT Mini displays
            if [ "$DISPLAY" != "btt_mini_12864" ]; then
              sed -i 's/^#define NEOPIXEL_LED/\/\/#define NEOPIXEL_LED/' marlin/Marlin/Configuration.h
              echo "Disabled NeoPixel (not BTT Mini 12864)"
            fi
          fi

          # === NEOPIXEL COLOR ===
          NEOPIXEL_COLOR=$(echo "$CUSTOMIZATIONS" | jq -r '.neopixelColor // empty')
          if [ -n "$NEOPIXEL_COLOR" ]; then
            case "$NEOPIXEL_COLOR" in
              "red")
                sed -i 's/^  #define NEOPIXEL_BKGD_COLOR.*/  #define NEOPIXEL_BKGD_COLOR         { 255, 0, 0, 0 }/' marlin/Marlin/Configuration.h
                echo "Set neopixel color to red"
                ;;
              "green")
                sed -i 's/^  #define NEOPIXEL_BKGD_COLOR.*/  #define NEOPIXEL_BKGD_COLOR         { 0, 255, 0, 0 }/' marlin/Marlin/Configuration.h
                echo "Set neopixel color to green"
                ;;
              "blue")
                sed -i 's/^  #define NEOPIXEL_BKGD_COLOR.*/  #define NEOPIXEL_BKGD_COLOR         { 0, 0, 255, 0 }/' marlin/Marlin/Configuration.h
                echo "Set neopixel color to blue"
                ;;
              "white")
                sed -i 's/^  #define NEOPIXEL_BKGD_COLOR.*/  #define NEOPIXEL_BKGD_COLOR         { 255, 255, 255, 0 }/' marlin/Marlin/Configuration.h
                echo "Set neopixel color to white"
                ;;
              "purple")
                sed -i 's/^  #define NEOPIXEL_BKGD_COLOR.*/  #define NEOPIXEL_BKGD_COLOR         { 175, 82, 222, 0 }/' marlin/Marlin/Configuration.h
                echo "Set neopixel color to purple"
                ;;
              "orange")
                sed -i 's/^  #define NEOPIXEL_BKGD_COLOR.*/  #define NEOPIXEL_BKGD_COLOR         { 255, 149, 0, 0 }/' marlin/Marlin/Configuration.h
                echo "Set neopixel color to orange"
                ;;
            esac
          fi

          echo "All customizations applied"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install --upgrade pip
          pip install platformio
          echo "PlatformIO installed"

      - name: Get PlatformIO environment
        id: pio-env
        run: |
          # Map board to PlatformIO environment
          case "${{ github.event.inputs.board }}" in
            "octopus_v1.1")
              echo "env=STM32F446ZE_btt" >> $GITHUB_OUTPUT
              ;;
            "octopus_pro")
              echo "env=BIGTREE_OCTOPUS_PRO_V1_F429" >> $GITHUB_OUTPUT
              ;;
            "skr_2")
              echo "env=BIGTREE_SKR_2" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "env=STM32F446ZE_btt" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Build firmware
        id: build
        run: |
          cd marlin
          platformio run -e ${{ steps.pio-env.outputs.env }}
          echo "Build completed"

      - name: Locate firmware binary
        id: firmware
        run: |
          # Find the firmware binary
          FIRMWARE_PATH=$(find marlin/.pio/build -name "firmware*.bin" | head -1)

          if [ -z "$FIRMWARE_PATH" ]; then
            echo "Firmware binary not found"
            exit 1
          fi

          echo "path=$FIRMWARE_PATH" >> $GITHUB_OUTPUT
          echo "Found firmware at: $FIRMWARE_PATH"

      - name: Setup AWS CLI for R2
        if: always()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install awscli
          aws configure set aws_access_key_id $R2_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $R2_SECRET_ACCESS_KEY

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-${{ github.event.inputs.build_id }}
          path: |
            marlin/Marlin/Configuration.h
            marlin/Marlin/Configuration_adv.h
            customizations.json
            ${{ steps.firmware.outputs.path }}

      - name: Upload config files to R2
        if: always()
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Upload config files for troubleshooting (always, even on failure)
          aws --endpoint-url $R2_ENDPOINT s3 cp \
            "marlin/Marlin/Configuration.h" \
            "s3://rep5x-firmware/${{ github.event.inputs.build_id }}/Configuration.h"

          aws --endpoint-url $R2_ENDPOINT s3 cp \
            "marlin/Marlin/Configuration_adv.h" \
            "s3://rep5x-firmware/${{ github.event.inputs.build_id }}/Configuration_adv.h"

          # Also save the customizations JSON
          aws --endpoint-url $R2_ENDPOINT s3 cp \
            "customizations.json" \
            "s3://rep5x-firmware/${{ github.event.inputs.build_id }}/customizations.json"

          echo "Config files uploaded to R2"

      - name: Upload firmware to R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws --endpoint-url $R2_ENDPOINT s3 cp \
            "${{ steps.firmware.outputs.path }}" \
            "s3://rep5x-firmware/${{ github.event.inputs.build_id }}/firmware.bin"

          echo "Firmware uploaded to R2"

      - name: Notify worker - Success
        if: success()
        run: |
          curl -X POST "${{ env.WORKER_URL }}/webhook" \
            -H "Content-Type: application/json" \
            -d '{"buildId": "${{ github.event.inputs.build_id }}", "status": "complete"}'

      - name: Notify worker - Failure
        if: failure()
        run: |
          curl -X POST "${{ env.WORKER_URL }}/webhook" \
            -H "Content-Type: application/json" \
            -d '{"buildId": "${{ github.event.inputs.build_id }}", "status": "failed", "error": "Build failed"}'

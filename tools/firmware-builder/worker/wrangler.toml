# Rep5x Firmware Builder - Cloudflare Worker Configuration
name = "rep5x-firmware-builder"
main = "worker.js"
compatibility_date = "2024-01-01"
account_id = "11841621d06b9ac8670135358549eb8c"

# Custom domain (configure in Cloudflare dashboard)
# routes = [{ pattern = "firmware-builder.rep5x.com/*", zone_name = "rep5x.com" }]

# KV Namespace for build status
[[kv_namespaces]]
binding = "BUILDS"
id = "5b335168510041348721f629a6cbffff"

# R2 Bucket for firmware storage
[[r2_buckets]]
binding = "FIRMWARE"
bucket_name = "rep5x-firmware"  # Create with: wrangler r2 bucket create rep5x-firmware

# Secrets (set via wrangler secret put)
# - GITHUB_TOKEN: GitHub Personal Access Token with repo and workflow permissions

[vars]
ENVIRONMENT = "production"
